lass="mt-3 text-2xl font-semibold text-slate-50 sm:text-3xl" data-i18n="contact.ctaTitle"></h3> <p class="mx-auto mt-2 max-w-2xl text-sm text-slate-300 sm:text-base" data-i18n="contact.ctaLead"></p> <div class="mt-6 flex flex-col items-center justify-center gap-3 sm:flex-row"> <a href="https://calendly.com/jdubois-cbtw/30min" target="_blank" rel="noreferrer" class="inline-flex w-full items-center justify-center rounded-xl bg-gradient-to-r from-[#39f5ff] to-[#ff4fd8] px-5 py-3 text-sm font-semibold text-[#0b1020] hover:opacity-90 sm:w-auto" data-i18n="contact.calendly"></a> <a href="https://www.linkedin.com/in/iamjiu/" target="_blank" rel="noreferrer" class="inline-flex w-full items-center justify-center rounded-xl border border-cyan-400/30 bg-white/5 px-5 py-3 text-sm font-semibold text-cyan-100 hover:bg-white/10 sm:w-auto" data-i18n="contact.linkedin"></a> </div> </div> </div> </div> </section> <footer class="footer-shell border-t border-cyan-400/20 bg-[#0b1020]/80"> <div class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8"> <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"> <p class="text-sm text-slate-400">© <span id="year"></span> Julie Dubois</p> <div class="flex gap-4 text-sm"> <a class="text-slate-400 hover:text-cyan-200" href="#services" data-i18n="nav.expertises"></a> <a class="text-slate-400 hover:text-cyan-200" href="#work" data-i18n="nav.trust"></a> <a class="text-slate-400 hover:text-cyan-200" href="#contact" data-i18n="nav.contact"></a> </div> </div> </div> </footer> </main>  <script>(function(){const baseUrl = "/";

  const langButtons = document.querySelectorAll("[data-lang]");
  const themeToggleButton = document.querySelector("[data-theme-toggle]");
  const setActiveButton = (lang) => {
    langButtons.forEach((btn) => {
      const active = btn.getAttribute("data-lang") === lang;
      btn.classList.toggle("bg-cyan-200/20", active);
      btn.classList.toggle("text-white", active);
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });
  };
  const applyTheme = (theme) => {
    const nextTheme = theme === "light" ? "light" : "dark";
    document.documentElement.dataset.theme = nextTheme;
    localStorage.setItem("theme", nextTheme);
    if (themeToggleButton) {
      themeToggleButton.setAttribute("aria-pressed", nextTheme === "dark" ? "true" : "false");
    }
  };

  let translationsCache = null;

  const applyTranslations = (lang, dicts) => {
    if (!dicts) return;
    const dict = dicts[lang] || dicts.fr;
    if (!dict) return;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.getAttribute("data-i18n");
      if (dict[key]) el.textContent = dict[key];
    });
    document.querySelectorAll("[data-i18n-html]").forEach((el) => {
      const key = el.getAttribute("data-i18n-html");
      if (dict[key]) el.innerHTML = dict[key];
    });
    setActiveButton(lang);
    localStorage.setItem("lang", lang);
  };

  langButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const lang = btn.getAttribute("data-lang");
      if (translationsCache) applyTranslations(lang, translationsCache);
      else {
        setActiveButton(lang);
        localStorage.setItem("lang", lang);
      }
    });
  });
  if (themeToggleButton) {
    themeToggleButton.addEventListener("click", () => {
      const currentTheme = document.documentElement.dataset.theme || "light";
      applyTheme(currentTheme === "light" ? "dark" : "light");
    });
  }

  const initI18n = async () => {
    try {
      const [frRes, enRes] = await Promise.all([
        fetch(`${baseUrl}i18n/fr.json`),
        fetch(`${baseUrl}i18n/en.json`),
      ]);
      if (!frRes.ok || !enRes.ok) throw new Error("i18n fetch failed");
      const [fr, en] = await Promise.all([frRes.json(), enRes.json()]);
      translationsCache = { fr, en };
    } catch (err) {
      translationsCache = null;
    }
    const savedLang = localStorage.getItem("lang") || "fr";
    const savedTheme = localStorage.getItem("theme") || "light";
    applyTheme(savedTheme);
    applyTranslations(savedLang, translationsCache);
  };

  initI18n();
  const year = document.getElementById("year");
  if (year) year.textContent = new Date().getFullYear();
})();</script> </body></html>
